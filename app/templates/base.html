{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ECE TU Room Booking{% endblock %}</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />

  <!-- Tailwind CDN (same as original) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: "#7e0000" },
          fontFamily: { sans: ['Sarabun', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- Shared CSS -->
  <link rel="stylesheet" href="{% static 'ece/css/common.css' %}">

  <!-- Page-specific CSS -->
  {% block extra_css %}{% endblock %}
</head>

<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

  {% block body %}{% endblock %}

  <!-- Shared API client (must load before page scripts) -->
  <script src="{% static 'ece/js/api.js' %}"></script>

  <!-- Page-specific JS -->
  {% block extra_js %}{% endblock %}
</body>

</html>
